<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLS에듀케이션 진단 도구</title>
<meta name="description" content="CLS에듀케이션에서 제공하는 입시 진단 도구 모음입니다. 신내동 CLS에듀케이션.">
<link rel="icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#FAF8F6; --card:#FFFFFF; --line:#EBE5DF; --ink:#1A1A1A; --dim:#6B6560;
    --brand:#F07020; --brand-dark:#D25A10;
    --shadow:0 1px 3px rgba(26,26,26,.05),0 8px 24px rgba(240,112,32,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); line-height:1.7;
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:52px 18px 70px;}
  header{text-align:center; margin-bottom:30px;}
  .brandline{font-size:11.5px; letter-spacing:.16em; color:var(--brand); font-weight:700; margin:0 0 11px;}
  h1{font-size:27px; font-weight:900; letter-spacing:-.02em; margin:0 0 9px; word-break:keep-all;}
  .sub{font-size:14.5px; color:var(--dim); margin:0; word-break:keep-all;}

  a.item{
    display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:20px 18px; margin-bottom:12px;
    transition:border-color .12s, transform .12s;
  }
  a.item:hover{border-color:var(--brand); transform:translateY(-1px);}
  a.item .tag{font-size:11.5px; letter-spacing:.12em; color:var(--brand); font-weight:700; margin:0 0 6px;}
  a.item h2{font-size:18px; font-weight:900; margin:0 0 6px; letter-spacing:-.01em; word-break:keep-all;}
  a.item p{font-size:14px; color:var(--dim); margin:0; word-break:keep-all;}

  footer{text-align:center; font-size:12.5px; color:var(--dim); margin-top:34px; line-height:1.8;}
  footer b{color:var(--ink); font-weight:700;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="brandline">신내동 CLS에듀케이션</p>
    <h1>진단 도구</h1>
    <p class="sub">필요한 진단을 골라 시작하세요.</p>
  </header>

  <a class="item" href="/susi">
    <p class="tag">고2 · 고3 · N수</p>
    <h2>수시 지원 전략 자가진단</h2>
    <p>성적과 61문항으로 나에게 맞는 전형과 계열, 대학 라인을 잡습니다. 결과는 A4 두 장짜리 상담 리포트로 받습니다.</p>
  </a>

  <footer>
    <b>CLS에듀케이션</b><br>
    서울 중랑구 봉화산로 218 영창빌딩 7층
  </footer>
</div>
</body>
</html>
