<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수시 지원 전략 자가진단 | CLS에듀케이션</title>
<meta name="description" content="내신과 모의고사, 고교학점제 이수 현황으로 나에게 맞는 수시 전형과 계열을 찾는 진단입니다. 신내동 CLS에듀케이션.">
<meta name="author" content="CLS에듀케이션">
<link rel="canonical" href="https://survey.158.247.198.11.sslip.io/susi">

<meta property="og:site_name" content="CLS에듀케이션">
<meta property="og:type" content="website">
<meta property="og:url" content="https://survey.158.247.198.11.sslip.io/susi">
<meta property="og:title" content="수시 지원 전략 자가진단, 고2와 고3">
<meta property="og:description" content="나에게 맞는 전형은 교과일까 학종일까 논술일까. 성적과 61문항으로 방향을 잡습니다.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#FAF8F6; --card:#FFFFFF; --line:#EBE5DF; --ink:#1A1A1A; --dim:#6B6560;
    --brand:#F07020; --brand-dark:#D25A10; --soft:#FDF1E8; --softline:#F6DCC6;
    --navy:#1E3A5F;
    --shadow:0 1px 3px rgba(26,26,26,.05),0 8px 24px rgba(240,112,32,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    line-height:1.7; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:680px; margin:0 auto; padding:26px 18px 70px;}

  header.top{text-align:center; margin-bottom:20px;}
  .brandline{font-size:11.5px; letter-spacing:.16em; color:var(--brand); font-weight:700; margin:0 0 11px;}
  h1{font-size:clamp(22px,5.6vw,30px); font-weight:900; line-height:1.34; margin:0 0 9px; letter-spacing:-.02em; word-break:keep-all;}
  h1 em{font-style:normal; color:var(--brand);}
  .sub{font-size:14.5px; color:var(--dim); margin:0; word-break:keep-all;}
  .tally{
    display:inline-flex; align-items:center; gap:6px; margin:14px 0 0;
    background:var(--soft); border:1px solid var(--softline); border-radius:99px;
    padding:7px 15px; font-size:13px; color:var(--brand-dark); word-break:keep-all;
  }
  .tally b{font-weight:900; font-variant-numeric:tabular-nums;}
  .tally svg{flex:0 0 auto;}

  .bar-wrap{position:sticky; top:0; z-index:10; background:var(--bg); padding:10px 0 12px; margin-bottom:8px;}
  .bar{height:6px; background:#EDE8E2; border-radius:99px; overflow:hidden;}
  .bar span{display:block; height:100%; width:0; background:var(--brand); border-radius:99px; transition:width .3s ease;}
  .bar-txt{display:flex; justify-content:space-between; font-size:12.5px; color:var(--dim); margin:7px 0 0;}
  .bar-txt b{color:var(--brand-dark); font-variant-numeric:tabular-nums;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:20px 18px; margin-bottom:14px;}
  .step-t{font-size:12px; letter-spacing:.14em; color:var(--brand); font-weight:700; margin:0 0 6px;}
  .step-h{font-size:19px; font-weight:900; margin:0 0 8px; letter-spacing:-.01em; word-break:keep-all;}
  .step-d{font-size:14px; color:var(--dim); margin:0 0 4px; word-break:keep-all;}

  .howto{background:var(--soft); border:1px solid var(--softline); border-radius:12px; padding:13px 15px; font-size:13.5px; color:var(--brand-dark); margin-bottom:12px; word-break:keep-all;}
  .howto b{color:var(--brand-dark); font-weight:700;}
  .safe{display:flex; gap:10px; align-items:flex-start; background:#F8F6F3; border:1px solid #E7E0D8; border-radius:12px; padding:13px 15px; font-size:13px; color:#5A544E; line-height:1.65; word-break:keep-all; margin-bottom:14px;}
  .safe svg{flex:0 0 auto; margin-top:2px;}
  .safe b{color:var(--ink);}

  label.f{display:block; font-size:13.5px; font-weight:700; margin:0 0 6px;}
  .hint{font-size:12.5px; color:var(--dim); font-weight:400;}
  input[type=text],input[type=tel],select{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px;
    font-family:inherit; font-size:15px; color:var(--ink); background:var(--card);
  }
  input:focus,select:focus{outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand);}
  .row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:14px;}
  .row.g5{grid-template-columns:repeat(auto-fit,minmax(104px,1fr));}
  .field{min-width:0;}

  .q{border-top:1px solid var(--line); padding-top:16px; margin-top:16px;}
  .q:first-of-type{border-top:0; padding-top:0; margin-top:0;}
  .qt{font-size:14.8px; font-weight:500; line-height:1.6; margin:0 0 11px; word-break:keep-all;}
  .qt b{color:var(--brand-dark); font-weight:700;}
  .choices{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .choices label{
    display:block; text-align:center; border:1.5px solid var(--line); border-radius:9px;
    padding:9px 4px; font-size:13.5px; cursor:pointer; transition:border-color .12s,background .12s,color .12s;
  }
  .choices label:hover{border-color:var(--brand); background:#FFF9F4;}
  .choices input{position:absolute; opacity:0; width:0; height:0;}
  .choices input:focus-visible + span{outline:2px solid var(--brand); outline-offset:3px; border-radius:4px;}
  .choices label.on{border-color:var(--brand); background:var(--brand); color:#fff; font-weight:700;}

  .nav{display:flex; gap:9px; margin-top:16px;}
  .btn{
    flex:1; border:0; border-radius:12px; padding:15px; font-family:inherit;
    font-size:16px; font-weight:700; cursor:pointer; transition:background .15s,border-color .15s,color .15s;
  }
  .btn.main{background:var(--brand); color:#fff;}
  .btn.main:hover{background:var(--brand-dark);}
  .btn.ghost{flex:0 0 auto; padding:15px 20px; background:transparent; border:1.5px solid var(--line); color:var(--dim); font-weight:500;}
  .btn.ghost:hover{border-color:var(--brand); color:var(--brand-dark);}
  .btn:focus-visible{outline:3px solid var(--brand-dark); outline-offset:2px;}
  /* 좁은 화면에서 버튼이 셋이 되면 여백을 줄여 다음 버튼 자리를 지킨다 */
  @media (max-width:400px){
    .btn.ghost{padding:15px 12px; font-size:14.5px;}
  }

  .flash{display:none; background:#FBEEEC; border:1px solid #E8CFC9; color:#8C3B2E; border-radius:10px; padding:12px 14px; font-size:13.5px; margin-top:12px; word-break:keep-all;}
  .flash.on{display:block;}

  /* 결과 */
  .res-head{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:28px 20px 24px; text-align:center; margin-bottom:14px;}
  .res-lab{font-size:12px; letter-spacing:.14em; color:var(--dim); font-weight:700; margin:0 0 12px;}
  .res-name{display:inline-block; background:var(--brand); color:#fff; padding:11px 26px; border-radius:99px; font-size:21px; font-weight:900; letter-spacing:-.01em;}
  .res-desc{font-size:14.5px; color:var(--dim); margin:14px 0 0; word-break:keep-all;}
  .sec-t{font-size:12px; letter-spacing:.14em; color:var(--brand); font-weight:700; margin:0 0 14px; padding-bottom:9px; border-bottom:1px solid var(--line);}

  .rank{display:flex; flex-direction:column; gap:11px;}
  .rank-row{display:grid; grid-template-columns:112px 1fr 42px; gap:10px; align-items:center; font-size:13.5px;}
  .rank-row .nm{font-weight:700; word-break:keep-all;}
  .rank-row .tr{background:#EDE8E2; border-radius:99px; height:9px; overflow:hidden;}
  .rank-row .tr i{display:block; height:100%; background:var(--brand); border-radius:99px;}
  .rank-row .vl{text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); font-size:12.5px;}
  .rank-row.top .nm{color:var(--brand-dark);}
  .rank-row.dim .tr i{background:#D9D2CA;}

  .line-box{background:var(--soft); border:1px solid var(--softline); border-radius:12px; padding:16px; margin-top:14px;}
  .line-box .k{font-size:12px; letter-spacing:.1em; color:var(--brand-dark); font-weight:700; margin:0 0 7px;}
  .line-box .v{font-size:16px; font-weight:900; margin:0 0 8px; word-break:keep-all;}
  .line-box .d{font-size:13.5px; color:#7A5B3A; margin:0; word-break:keep-all; line-height:1.7;}

  ul.plain{margin:0; padding-left:17px; display:flex; flex-direction:column; gap:8px; font-size:14px;}
  ul.plain li::marker{color:var(--brand);}
  .note{font-size:12.5px; color:var(--dim); margin:16px 0 0; line-height:1.7; text-align:center; word-break:keep-all;}

  .cta{background:var(--brand); border-radius:14px; padding:24px 20px; text-align:center; margin-top:14px;}
  .cta h2{font-size:19px; font-weight:900; color:#fff; margin:0 0 9px; line-height:1.45; word-break:keep-all;}
  .cta p{font-size:14px; color:#FFE6D5; margin:0 0 17px; line-height:1.7; word-break:keep-all;}
  .cta a{display:block; border-radius:10px; padding:14px; text-decoration:none; font-size:15.5px; font-weight:700; margin-bottom:9px;}
  .cta a.primary{background:#fff; color:var(--brand-dark);}
  .cta a.ghost2{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.45);}
  .cta a:last-child{margin-bottom:0;}

  footer{text-align:center; font-size:12.5px; color:var(--dim); margin-top:26px; line-height:1.8;}
  footer b{color:var(--ink); font-weight:700;}
  .hidden{display:none;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

  /* ── 결과 화면 ─────────────────────────────────────────────── */
  .hero{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:26px 20px 24px; text-align:center; margin-bottom:14px;}
  .hero .lab{font-size:11.5px; letter-spacing:.16em; color:var(--dim); font-weight:700; margin:0 0 16px;}
  .hero .tag{display:inline-block; background:var(--soft); border:1px solid var(--softline); color:var(--brand-dark); border-radius:99px; padding:5px 13px; font-size:12.5px; font-weight:700; margin:0 0 10px;}
  .hero h2{font-size:25px; font-weight:900; letter-spacing:-.02em; margin:0 0 9px; word-break:keep-all;}
  .hero .desc{font-size:14px; color:var(--dim); margin:0; word-break:keep-all;}
  .gauge{display:block; margin:0 auto 14px;}

  .pair{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:16px;}
  .pair .box{background:var(--soft); border:1px solid var(--softline); border-radius:12px; padding:12px 13px; text-align:left;}
  .pair .box p{margin:0;}
  .pair .box .k{font-size:11px; letter-spacing:.1em; color:var(--brand-dark); font-weight:700; margin-bottom:5px;}
  .pair .box .v{font-size:14.5px; font-weight:700; word-break:keep-all; line-height:1.45;}

  .chart{display:block; margin:0 auto; max-width:100%; height:auto;}
  .legend{display:flex; flex-direction:column; gap:9px; margin-top:14px;}
  .legend .row{display:grid; grid-template-columns:11px 1fr auto; gap:10px; align-items:center; font-size:13.5px;}
  .legend .dot{width:11px; height:11px; border-radius:3px;}
  .legend .nm{color:var(--ink); word-break:keep-all;}
  .legend .vl{color:var(--dim); font-variant-numeric:tabular-nums; font-size:12.5px;}

  .detail{margin-top:2px;}
  .detail .blk{border-top:1px solid var(--line); padding-top:13px; margin-top:13px;}
  .detail .blk:first-child{border-top:0; padding-top:0; margin-top:0;}
  .detail .k{font-size:11.5px; letter-spacing:.1em; color:var(--brand); font-weight:700; margin:0 0 6px;}
  .detail p{margin:0; font-size:14px; word-break:keep-all; line-height:1.75;}
  .detail ol{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:7px; font-size:14px;}
  .detail ol li{word-break:keep-all; line-height:1.7;}
  .detail ol li::marker{color:var(--brand); font-weight:700;}
  .detail .warn{background:#FBF6F2; border:1px solid #EFE0D2; border-radius:10px; padding:11px 13px; font-size:13.5px; color:#7A5B3A; word-break:keep-all;}

  .seg{display:flex; gap:3px; margin:2px 0 12px;}
  .seg i{flex:1; height:15px; border-radius:3px; background:#EDE8E2;}
  .seg i.on{background:var(--brand);}

  .scale{display:flex; gap:3px; margin-bottom:13px;}
  .scale .st{flex:1; text-align:center;}
  .scale .st .bx{height:7px; border-radius:99px; background:#EDE8E2;}
  .scale .st.on .bx{background:var(--brand);}
  .scale .st .tx{display:block; font-size:10.5px; color:var(--dim); margin-top:6px; word-break:keep-all; line-height:1.3;}
  .scale .st.on .tx{color:var(--brand-dark); font-weight:700;}

  .share-btns{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px;}
  .share-btns button{
    border:0; border-radius:11px; padding:14px 10px; font-family:inherit; font-size:14.5px;
    font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .share-btns .save{background:var(--brand); color:#fff;}
  .share-btns .save:hover{background:var(--brand-dark);}
  .share-btns .copy{background:var(--card); color:var(--brand-dark); border:1.5px solid var(--softline);}
  .share-btns .copy:hover{border-color:var(--brand);}
  .share-btns button:disabled{opacity:.55; cursor:default;}
  .share-note{font-size:12.5px; color:var(--dim); margin:11px 0 0; text-align:center; word-break:keep-all; line-height:1.6;}

  /* 카카오톡 안에서 열었을 때 뜨는 안내 */
  .inapp{background:#FFF4E6; border:1.5px solid #F3C99B; border-radius:14px; padding:17px 18px; margin-bottom:14px;}
  .inapp .k{font-size:15px; font-weight:900; color:var(--brand-dark); margin:0 0 8px;}
  .inapp p{margin:0; font-size:13.8px; color:#7A5B3A; word-break:keep-all; line-height:1.7;}
  .inapp p.sm{font-size:12.5px; color:#96755A; margin-top:10px;}
  .inapp button{
    display:block; width:100%; margin-top:13px; border:0; border-radius:11px; padding:14px;
    background:var(--brand); color:#fff; font-family:inherit; font-size:15.5px; font-weight:700; cursor:pointer;
  }
  .inapp button:hover{background:var(--brand-dark);}
  /* 결과지 보기 화면 (이미지로 변환된 A4 두 장) */
  .rp-view{position:fixed; inset:0; z-index:60; background:#2A2724; display:flex; flex-direction:column;}
  .rp-view.hidden{display:none;}
  .rp-view-bar{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:13px 15px; background:#1F1D1B; color:#fff; font-size:14.5px; font-weight:700;
  }
  .rp-view-bar button{
    background:transparent; border:1.5px solid rgba(255,255,255,.35); color:#fff;
    border-radius:9px; padding:7px 15px; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .rp-view-bar button:hover{border-color:#fff;}
  #rpPreview{flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:12px; align-items:center;}
  #rpPreview img{width:100%; max-width:620px; display:block; border-radius:5px; box-shadow:0 8px 28px rgba(0,0,0,.4);}
  #rpPreview p{color:#BDB6AF; font-size:13.5px; text-align:center; margin:24px 0 0; line-height:1.7;}
  .rp-view-actions{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
    padding:12px 15px calc(12px + env(safe-area-inset-bottom)); background:#1F1D1B;
  }
  .rp-view-actions button{
    border:0; border-radius:10px; padding:14px 6px; font-family:inherit;
    font-size:14px; font-weight:700; cursor:pointer; color:#fff;
  }
  .rp-view-actions .save{background:var(--brand);}
  .rp-view-actions .save:hover{background:var(--brand-dark);}
  .rp-view-actions .copy{background:#3B3733;}
  .rp-view-actions .copy:hover{background:#4A453F;}
  .rp-view-actions button:disabled{opacity:.5; cursor:default;}
  .rp-view-note{
    grid-column:1/-1; margin:2px 0 0; text-align:center;
    font-size:12.5px; color:#BDB6AF; line-height:1.6; word-break:keep-all;
  }
  /* ── A4 결과지 ─────────────────────────────────────────────
     화면에서는 화면 밖에 두고, 인쇄할 때만 나타난다.
     이미지 저장은 이 영역을 그대로 캡처한다. */
  #report{position:absolute; left:-10000px; top:0; width:210mm; background:#fff;}
  /* 높이를 A4 한 장으로 고정한다. 넘치면 아래 fitSheets() 가 내용을 살짝 줄여
     정확히 한 장에 담는다. 이렇게 해야 인쇄할 때 페이지가 중간에 끊기지 않는다. */
  .sheet{
    width:210mm; height:297mm; box-sizing:border-box; padding:12mm 13mm 15mm;
    background:#fff; color:#1A1A1A; position:relative; overflow:hidden;
    font-size:9.6pt; line-height:1.55; letter-spacing:-.01em;
  }
  .sheet-inner{transform-origin:top left;}
  .sheet + .sheet{margin-top:8mm;}

  .rp-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5mm;}
  .rp-brand{margin:0; font-size:10.5pt; font-weight:900; color:var(--navy); letter-spacing:.02em;}
  .rp-brand span{font-weight:500; color:#6B6560; font-size:9pt;}
  .rp-date{margin:0; font-size:8.6pt; color:#6B6560;}
  .rp-title{margin:0; font-size:18pt; font-weight:900; letter-spacing:-.03em; color:#111;}
  .rp-sub{margin:1.5mm 0 0; font-size:9.4pt; color:#6B6560;}
  .rp-rule{height:2.2px; background:var(--navy); margin:3mm 0 4.5mm;}

  .rp-meta{display:grid; grid-template-columns:repeat(5,1fr); gap:0; border:1px solid #D9D5CF; margin-bottom:5mm;}
  .rp-meta div{padding:2.6mm 3mm; border-right:1px solid #E7E3DD;}
  .rp-meta div:last-child{border-right:0;}
  .rp-meta span{display:block; font-size:8pt; color:#8A837C; margin-bottom:.8mm;}
  .rp-meta b{font-size:10pt; font-weight:700; word-break:keep-all;}
  .rp-meta b.tel{font-size:9.2pt; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}

  .rp-h{display:flex; align-items:center; gap:2.2mm; margin:0 0 3.2mm; font-size:11.4pt; font-weight:900; letter-spacing:-.02em;}
  .rp-h i{
    flex:0 0 auto; width:5.4mm; height:5.4mm; border-radius:1.2mm; background:var(--navy);
    color:#fff; font-style:normal; font-size:8.6pt; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .rp-sec{margin-bottom:5mm;}

  .rp-grid2{display:grid; grid-template-columns:1fr 1fr; gap:5mm; align-items:stretch;}
  .rp-grid2.wide-left{grid-template-columns:1.2fr 1fr;}
  .rp-grid2 > *{min-width:0;}
  .rp-col{display:flex; flex-direction:column; justify-content:center;}
  .rp-chart{display:flex; align-items:center; justify-content:center; height:100%;}
  .rp-box{border:1px solid #E2DED8; border-radius:2mm; padding:4mm; background:#FCFBFA; height:100%;}
  .rp-box.plain{background:#fff;}
  .rp-box.center{text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .rp-k{margin:0 0 1.8mm; font-size:8.2pt; font-weight:700; letter-spacing:.08em; color:var(--brand-dark);}
  .rp-box p{margin:0 0 2mm; word-break:keep-all;}
  .rp-box p:last-child{margin-bottom:0;}
  .rp-badge{display:inline-block; background:var(--brand); color:#fff; border-radius:99px; padding:1.6mm 5mm; font-size:12pt; font-weight:900;}
  .rp-cap{font-size:8.8pt; color:#6B6560;}
  .rp-note-sm{margin:2.5mm 0 0; font-size:8.4pt; color:#8A837C; word-break:keep-all;}

  .rp-bars{display:flex; flex-direction:column; gap:2.2mm;}

        '<p class="step-d" style="margin-bottom:16px">' + esc(f.majors) + '</p>';
      f.qs.forEach(function(q, i){ h += qBlock('field_' + f.key, i, q); });
      h += '</div>';
    });
    return h;
  }

  /* ─────────────────────────────────────────────
     검증
     ───────────────────────────────────────────── */
  function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ''; }

  function vInfo(){
    var name = val('i-name'), phone = val('i-phone'), grade = val('i-grade');
    var agree = document.getElementById('i-agree');
    if (!name) return '학생 이름을 적어 주세요.';
    if (!phone) return '연락처를 적어 주세요.';
    if (!/^[0-9\-\s]{9,}$/.test(phone)) return '연락처를 숫자로 정확히 적어 주세요.';
    if (!grade) return '학년을 골라 주세요.';
    if (!agree || !agree.checked) return '개인정보 수집에 동의해 주셔야 결과를 보내 드릴 수 있습니다.';
    state.info = { name:name, phone:phone, school:val('i-school'), grade:grade, agreed:true };
    return null;
  }

  function num(id){ var v = val(id); return v === '' ? null : Number(v); }

  // 내신 칸: 비었으면 null, 적었으면 1.00~9.00 사이의 소수. 잘못 적었으면 NaN.
  function vGrades(){
    if (!num('n-all')) return '내신 전 교과 평균 등급을 골라 주세요. 대학 라인을 잡는 기준입니다.';
    if (!num('m-math')) return '모의고사 수학 등급을 골라 주세요.';
    state.grades = {
      naesinKor:num('n-kor'), naesinMath:num('n-math'), naesinEng:num('n-eng'),
      naesinInq:num('n-inq'), naesinAll:num('n-all'),
      mockKor:num('m-kor'), mockMath:num('m-math'), mockEng:num('m-eng'),
      mockInq1:num('m-inq1'), mockInq2:num('m-inq2'), mathChoice:val('m-choice')
    };
    return null;
  }

  function collect(groupId, count){
    var out = [];
    for (var i = 0; i < count; i++) {
      var el = document.querySelector('input[name="' + groupId + '_' + i + '"]:checked');
      out.push(el ? Number(el.value) : null);
    }
    return out;
  }

  function firstMissing(groupId, count){
    var a = collect(groupId, count);
    for (var i = 0; i < a.length; i++) if (a[i] === null) return i;
    return -1;
  }

  function scrollToQ(groupId, idx){
    var el = document.querySelector('label[data-g="' + groupId + '"][data-i="' + idx + '"]');
    if (el) el.closest('.q').scrollIntoView({ behavior:'smooth', block:'center' });
  }

  function vCredit(){
    var m = firstMissing('credit', CREDIT.length);
    if (m !== -1) { scrollToQ('credit', m); return '아직 고르지 않은 문항이 있습니다.'; }
    state.credit = collect('credit', CREDIT.length);
    return null;
  }

  function vTypes(){
    for (var i = 0; i < TYPES.length; i++) {
      var t = TYPES[i], g = 'type_' + t.key;
      var m = firstMissing(g, t.qs.length);
      if (m !== -1) { scrollToQ(g, m); return t.name + '에 아직 고르지 않은 문항이 있습니다.'; }
      state.types[t.key] = collect(g, t.qs.length);
    }
    return null;
  }

  function vFields(){
    for (var i = 0; i < FIELDS.length; i++) {
      var f = FIELDS[i], g = 'field_' + f.key;
      var m = firstMissing(g, f.qs.length);
      if (m !== -1) { scrollToQ(g, m); return f.name + '에 아직 고르지 않은 문항이 있습니다.'; }
      state.fields[f.key] = collect(g, f.qs.length);
    }
    return null;
  }

  /* 지금 화면에 입력된 것을 있는 그대로 담아 둔다.
     검증(vXxx)은 다 채웠을 때만 저장하기 때문에, 뒤로 가면 고르던 답이 날아갔다.
     이전·처음으로를 누를 때 이 함수로 먼저 담아 두면 그대로 남는다. */
  function capture(i){
    if (i === 0) {
      var ag = document.getElementById('i-agree');
      state.info.name = val('i-name');
      state.info.phone = val('i-phone');
      state.info.school = val('i-school');
      state.info.grade = val('i-grade');
      state.info.agreed = !!(ag && ag.checked);
    }
    if (i === 1) {
      state.grades.naesinKor = num('n-kor'); state.grades.naesinMath = num('n-math');
      state.grades.naesinEng = num('n-eng');  state.grades.naesinInq = num('n-inq');
      state.grades.naesinAll = num('n-all');
      state.grades.mockKor = num('m-kor');   state.grades.mockMath = num('m-math');
      state.grades.mockEng = num('m-eng');   state.grades.mockInq1 = num('m-inq1');
      state.grades.mockInq2 = num('m-inq2'); state.grades.mathChoice = val('m-choice');
    }
    if (i === 2) state.credit = collect('credit', CREDIT.length);
    if (i === 3) TYPES.forEach(function(t){ state.types[t.key] = collect('type_' + t.key, t.qs.length); });
    if (i === 4) FIELDS.forEach(function(f){ state.fields[f.key] = collect('field_' + f.key, f.qs.length); });
  }

  /* ─────────────────────────────────────────────
     판정
     ───────────────────────────────────────────── */
  function sum(a){ return a.reduce(function(x,y){ return x + (y||0); }, 0); }

  function mockAvg(){
    var g = state.grades;
    var arr = [g.mockKor, g.mockMath, g.mockEng, g.mockInq1, g.mockInq2].filter(function(v){ return v; });
    if (!arr.length) return 9;
    arr.sort(function(a,b){ return a-b; });
    var take = arr.slice(0, Math.min(3, arr.length));
    return take.reduce(function(x,y){ return x+y; }, 0) / take.length;
  }

  function judge(){
    var typeScores = TYPES.map(function(t){
      return { key:t.key, name:t.name, short:t.short, score:sum(state.types[t.key]), max:t.qs.length*2 };
    });
    var fieldScores = FIELDS.map(function(f){
      return { key:f.key, name:f.name, majors:f.majors, score:sum(state.fields[f.key]), max:f.qs.length*2 };
    });
    typeScores.sort(function(a,b){ return b.score - a.score; });
    fieldScores.sort(function(a,b){ return b.score - a.score; });

    var credit = sum(state.credit);
    var m = mockAvg(), n = state.grades.naesinAll || 9;
    var line = LINES.filter(function(L){ return L.cond(n); })[0] || LINES[LINES.length-1];

    return { typeScores:typeScores, fieldScores:fieldScores, credit:credit, line:line, mock:m, naesin:n };
  }

  function creditText(c){
    if (c >= 10) return { t:'최상', d:'전공과 이어지는 과목을 빠짐없이 들었습니다. 학종 서류에서 이수 노력으로 감점될 일이 없습니다.' };
    if (c >= 6)  return { t:'보통', d:'무난합니다. 덜 들은 핵심 과목이 있다면 면접에서 왜 그랬는지 설명할 수 있게 준비해 두세요.' };
    return { t:'취약', d:'전공 관련 과목 이수가 얕습니다. 과목 선택을 정성평가하지 않는 교과 전형이나 약술형 논술 쪽이 안전합니다.' };
  }

  /* ─────────────────────────────────────────────
     결과 화면
     ───────────────────────────────────────────── */
  var LINE_SHORT = { A:'최상위', B:'상위권', C:'중상위', D:'약술형', E:'최저 없음' };
  var SHADES = ['#F07020', '#F5A165', '#FAD0AE'];
  var LAST = null;   // 이미지 카드용으로 마지막 판정을 들고 있는다

  function rankRows(list, unit){
    return list.map(function(r, i){
      var pct = r.max ? Math.round(r.score / r.max * 100) : 0;
      var cls = i === 0 ? 'rank-row top' : (r.score === 0 ? 'rank-row dim' : 'rank-row');
      return '<div class="' + cls + '">' +
        '<span class="nm">' + esc(r.short || r.name) + '</span>' +
        '<span class="tr"><i style="width:' + pct + '%"></i></span>' +
        '<span class="vl">' + r.score + unit + '</span></div>';
    }).join('');
  }

  /* ── 그래프 ────────────────────────────────────────────────
     한 계열(오렌지) 한 색으로만 그린다. 색이 뜻을 갖는 곳은
     원서 배분 도넛 하나뿐이고, 거기서도 같은 색의 세 단계만 쓴다. */

  // 원형 게이지, 1순위 전형의 적합도 한 값
  /* 원호는 stroke-dasharray 와 rotate 로 그리지 않고 좌표로 직접 그린다.
     이미지로 변환할 때(html2canvas) dasharray 와 transform 이 제대로 옮겨지지 않아
     게이지와 도넛만 잘려 나오던 문제가 있었다.
     viewBox 와 width, height 숫자도 반드시 같아야 어긋나지 않는다. */
  function polarXY(cx, cy, r, deg){
    var a = (deg - 90) * Math.PI / 180;
    return [ (cx + r * Math.cos(a)).toFixed(2), (cy + r * Math.sin(a)).toFixed(2) ];
  }

  function arcPath(cx, cy, r, from, to){
    if (to - from >= 360) to = from + 359.99;
    var s = polarXY(cx, cy, r, from), e = polarXY(cx, cy, r, to);
    return 'M' + s[0] + ' ' + s[1] + ' A' + r + ' ' + r + ' 0 ' +
           ((to - from) > 180 ? 1 : 0) + ' 1 ' + e[0] + ' ' + e[1];
  }

  function gaugeSVG(score, max){
    var pct = max ? Math.round(score / max * 100) : 0;
    var W = 132, c = W / 2, r = 52;
    return '<svg class="gauge" viewBox="0 0 ' + W + ' ' + W + '" width="' + W + '" height="' + W + '" ' +
      'role="img" aria-label="적합도 ' + pct + '퍼센트">' +
      '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="#EDE8E2" stroke-width="12"/>' +
      (pct > 0 ? '<path d="' + arcPath(c, c, r, 0, pct * 3.6) + '" fill="none" stroke="#F07020" ' +
        'stroke-width="12" stroke-linecap="round"/>' : '') +
      '<text x="' + c + '" y="' + (c - 2) + '" text-anchor="middle" font-size="29" font-weight="900" fill="#1A1A1A">' + pct + '%</text>' +
      '<text x="' + c + '" y="' + (c + 19) + '" text-anchor="middle" font-size="11.5" fill="#6B6560">적합도</text>' +
      '</svg>';
  }

  // 레이더, 여섯 전형의 균형을 한눈에
  function radarSVG(items){
    var cx = 150, cy = 148, R = 86, n = items.length, i;
    function P(idx, ratio){
      var a = -Math.PI / 2 + idx * 2 * Math.PI / n;
      return [cx + Math.cos(a) * R * ratio, cy + Math.sin(a) * R * ratio];
    }
    function poly(ratio){
      var pts = [];
      for (i = 0; i < n; i++) { var p = P(i, ratio); pts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1)); }
      return pts.join(' ');
    }
    var s = '';
    [0.25, 0.5, 0.75, 1].forEach(function(g){
      s += '<polygon points="' + poly(g) + '" fill="none" stroke="#EDE8E2" stroke-width="1"/>';
    });
    for (i = 0; i < n; i++) {
      var e = P(i, 1);
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) +
           '" stroke="#EDE8E2" stroke-width="1"/>';
    }
    var dpts = [], dots = '';
    for (i = 0; i < n; i++) {
      var ratio = items[i].max ? items[i].score / items[i].max : 0;
      var p = P(i, Math.max(ratio, 0.03));
      dpts.push(p[0].toFixed(1) + ',' + p[1].toFixed(1));
      dots += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) +
              '" r="4.5" fill="#F07020" stroke="#FFFFFF" stroke-width="2"/>';
    }
    s += '<polygon points="' + dpts.join(' ') + '" fill="rgba(240,112,32,.15)" stroke="#F07020" ' +
         'stroke-width="2" stroke-linejoin="round"/>' + dots;
    for (i = 0; i < n; i++) {
      var lp = P(i, 1.26), a = -Math.PI / 2 + i * 2 * Math.PI / n;
      var c = Math.cos(a), sn = Math.sin(a);
      var anchor = Math.abs(c) < 0.3 ? 'middle' : (c > 0 ? 'start' : 'end');
      var dy = sn > 0.5 ? 11 : (sn < -0.5 ? -4 : 4);
      s += '<text x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + dy).toFixed(1) + '" text-anchor="' + anchor +
           '" font-size="11.5" font-weight="700" fill="#6B6560">' + esc(items[i].label) + '</text>';
    }
    return '<svg class="chart" viewBox="0 0 300 296" width="300" height="296" role="img" ' +
      'aria-label="전형별 적합도 육각 그래프">' + s + '</svg>';
  }

  // 도넛, 수시 여섯 장을 어디에 걸지
  function donutSVG(parts){
    var W = 148, c = W / 2, r = 54, gapDeg = 4, acc = 0, s = '';
    parts.forEach(function(p, i){
      var span = 360 * (p.n / 6);
      var from = acc + gapDeg / 2, to = acc + span - gapDeg / 2;
      if (to > from) {
        s += '<path d="' + arcPath(c, c, r, from, to) + '" fill="none" stroke="' +
             SHADES[i % SHADES.length] + '" stroke-width="17"/>';
      }
      acc += span;
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + W + '" width="' + W + '" height="' + W + '" ' +
      'role="img" aria-label="원서 여섯 장 배분">' + s +
      '<text x="' + c + '" y="' + (c - 3) + '" text-anchor="middle" font-size="25" font-weight="900" fill="#1A1A1A">6장</text>' +
      '<text x="' + c + '" y="' + (c + 17) + '" text-anchor="middle" font-size="11" fill="#6B6560">수시 지원</text></svg>';
  }

  // 12칸 미터, 고교학점제 이수 충실도
  function segMeter(score, max){
    var s = '<div class="seg" role="img" aria-label="이수 ' + score + '점, ' + max + '점 만점">';
    for (var i = 0; i < max; i++) s += '<i class="' + (i < score ? 'on' : '') + '"></i>';
    return s + '</div>';
  }

  // 대학 라인 여섯 구간 중 내 위치
  function lineScale(key){
    return '<div class="scale">' + LINES.map(function(L){
      return '<div class="st' + (L.key === key ? ' on' : '') + '">' +
        '<div class="bx"></div><span class="tx">' + esc(LINE_SHORT[L.key] || L.key) + '</span></div>';
    }).join('') + '</div>';
  }

  // 상위 세 전형에 여섯 장을 점수 비례로 나눈다 (각 최소 한 장)
  function plan6(list){
    var pool = list.filter(function(t){ return t.score > 0; }).slice(0, 3);
    if (!pool.length) pool = [list[0]];
    var total = pool.reduce(function(a, b){ return a + b.score; }, 0) || 1;
    var rest = 6 - pool.length;
    var raw = pool.map(function(t){ return rest * (t.score / total); });
    var out = pool.map(function(t, i){ return { name: t.short || t.name, n: 1 + Math.floor(raw[i]) }; });
    var used = out.reduce(function(a, b){ return a + b.n; }, 0);
    var order = raw.map(function(v, i){ return { i: i, f: v - Math.floor(v) }; })
                   .sort(function(a, b){ return b.f - a.f; });
    var k = 0;
    while (used < 6) { out[order[k % order.length].i].n++; used++; k++; }
    return out;
  }

  function showResult(){
    var R = judge();
    var t0 = R.typeScores[0], t1 = R.typeScores[1];
    var f0 = R.fieldScores[0];
    var ct = creditText(R.credit);
    var tInfo = TYPES.filter(function(x){ return x.key === t0.key; })[0];

    var det = TYPE_DETAIL[t0.key];
    var parts = plan6(R.typeScores);
    // 레이더는 순위가 아니라 TYPES 순서 그대로 그려야 모양이 일정하다.
    var typeFixed = TYPES.map(function(t){
      return { label:t.short, score:sum(state.types[t.key]), max:t.qs.length * 2 };
    });
    R.typeFixed = typeFixed;

    var h = '';
    h += '<div class="hero">' +
      '<p class="lab">나에게 맞는 전형</p>' +
      gaugeSVG(t0.score, t0.max) +
      '<p class="tag">' + esc(det.tag) + '</p>' +
      '<h2>' + esc(t0.name) + '</h2>' +
      '<p class="desc">' + esc(tInfo.desc) + '</p>' +
      '<div class="pair">' +
        '<div class="box"><p class="k">함께 볼 전형</p><p class="v">' + esc(t1.name) + '</p></div>' +
        '<div class="box"><p class="k">잘 맞는 계열</p><p class="v">' + esc(f0.name) + '</p></div>' +
      '</div>' +
    '</div>';

    h += '<div class="card"><p class="sec-t">이런 학생입니다</p><div class="detail">' +
      '<div class="blk"><p class="k">성향</p><p>' + esc(det.who) + '</p></div>' +
      '<div class="blk"><p class="k">강점</p><p>' + esc(det.strong) + '</p></div>' +
      '<div class="blk"><p class="k">지금 할 일</p><ol>' +
        det.todo.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') +
      '</ol></div>' +
      '<div class="blk"><p class="k">주의할 점</p><p class="warn">' + esc(det.watch) + '</p></div>' +
    '</div></div>';

    h += '<div class="card"><p class="sec-t">전형별 적합도</p>' +
      radarSVG(typeFixed) +
      '<div class="rank" style="margin-top:6px">' + rankRows(R.typeScores, '점') + '</div>' +
      '<p class="note" style="text-align:left;margin-top:14px">각 10점 만점입니다. 위 두 전형에 원서를 몰아 주는 것이 기본입니다.</p></div>';

    h += '<div class="card"><p class="sec-t">수시 여섯 장, 이렇게 나눕니다</p>' +
      donutSVG(parts) +
      '<div class="legend">' + parts.map(function(p, i){
        return '<div class="row"><span class="dot" style="background:' + SHADES[i % SHADES.length] + '"></span>' +
          '<span class="nm">' + esc(p.name) + '</span><span class="vl">' + p.n + '장</span></div>';
      }).join('') + '</div>' +
      '<p class="note" style="text-align:left;margin-top:14px">적합도 점수로 나눈 제안입니다. 실제 여섯 장은 성적표와 생활기록부를 함께 놓고 확정합니다.</p></div>';

    h += '<div class="card"><p class="sec-t">계열 적합도</p><div class="rank">' +
      rankRows(R.fieldScores.map(function(f){ return { short:f.name, score:f.score, max:f.max }; }), '점') + '</div>' +
      '<div class="line-box" style="margin-top:16px">' +
        '<p class="k">가장 잘 맞는 계열</p>' +
        '<p class="v">' + esc(f0.name) + '</p>' +
        '<p class="d">' + esc(f0.majors) + '</p>' +
        '<p class="d" style="margin-top:8px"><b>이런 일로 이어집니다</b><br>' + esc(FIELD_JOBS[f0.key] || '') + '</p>' +
      '</div></div>';

    h += '<div class="card"><p class="sec-t">고교학점제 과목 이수</p>' +
      segMeter(R.credit, 12) +
      '<p class="note" style="text-align:left;margin:0 0 13px">' + R.credit + '점 / 12점 만점</p>' +
      '<div class="line-box" style="margin-top:0">' +
        '<p class="k">' + esc(ct.t) + ' 이수</p>' +
        '<p class="d">' + esc(ct.d) + '</p>' +
      '</div></div>';

    var mc = minCheck(R.mock);
    var nc = nonsulCard(R.mock, R.naesin);

    h += '<div class="card"><p class="sec-t">성적으로 본 대학 라인</p>' +
      lineScale(R.line.key) +
      '<div class="line-box" style="margin-top:0">' +
        '<p class="k">' + esc(R.line.name) + '</p>' +
        '<p class="v">' + esc(R.line.unis) + '</p>' +
        '<p class="d">' + esc(R.line.plan) + '</p>' +
      '</div>' +
      '<div class="detail" style="margin-top:16px">' +

  /* ─────────────────────────────────────────────
     A4 결과지
     화면 밖 #report 에 두 장을 그려 두고
     인쇄(PDF 저장)와 이미지 저장, 공유에 함께 쓴다.
     ───────────────────────────────────────────── */
  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  // 학생이 붙여 쓴 번호도 010-1234-5678 모양으로 보여 준다
  function fmtPhone(raw){
    var d = String(raw || '').replace(/[^0-9]/g, '');
    if (d.length === 11) return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
    if (d.length === 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    return raw || '';
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '. ' + pad2(d.getMonth() + 1) + '. ' + pad2(d.getDate());
  }

  function rpBars(list, unit){
    return '<div class="rp-bars">' + list.map(function(r, i){
      var pct = r.max ? Math.round(r.score / r.max * 100) : 0;
      var cls = i === 0 ? 'rp-bar top' : (r.score === 0 ? 'rp-bar dim' : 'rp-bar');
      return '<div class="' + cls + '">' +
        '<span class="nm">' + esc(r.short || r.name) + '</span>' +
        '<span class="tr"><i style="width:' + pct + '%"></i></span>' +
        '<span class="vl">' + r.score + unit + '</span></div>';
    }).join('') + '</div>';
  }

  function rpSeg(score, max){
    var s = '<div class="rp-seg">';
    for (var i = 0; i < max; i++) s += '<i class="' + (i < score ? 'on' : '') + '"></i>';
    return s + '</div>';
  }

  /* 결과지 그래프는 SVG 대신 캔버스에 직접 그린다.
     화면에서는 SVG가 잘 보이지만, 결과지를 이미지로 바꾸는 단계에서
     원호가 잘려 나오는 일이 있어 결과지에서만 방식을 바꿨다. */
  var CF = '"Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif';
  var chartsReady = false, chartsWaiting = [];

  function onCharts(fn){
    if (chartsReady) { fn(); return; }
    chartsWaiting.push(fn);
  }

  function markCharts(){
    chartsReady = true;
    chartsWaiting.forEach(function(f){ f(); });
    chartsWaiting = [];
  }

  function withFonts(fn){
    if (!document.fonts || !document.fonts.load) { fn(); return; }
    Promise.all([
      document.fonts.load('900 29px "Noto Sans KR"'),
      document.fonts.load('700 12px "Noto Sans KR"'),
      document.fonts.load('400 11px "Noto Sans KR"')
    ]).then(function(){ fn(); }, function(){ fn(); });
  }

  /* 그리는 좌표는 그대로 두고 화면에 보이는 크기만 disp 배로 줄인다.
     그래야 그림이 어긋나지 않으면서 A4 한 장에 들어간다. */
  function chartCanvas(w, h, draw, disp){
    var c = document.createElement('canvas'), dpr = 2, k = disp || 1;
    c.width = w * dpr; c.height = h * dpr;
    c.style.width = Math.round(w * k) + 'px';
    c.style.height = Math.round(h * k) + 'px';
    c.style.display = 'block';
    c.style.flex = '0 0 auto';
    var x = c.getContext('2d');
    x.scale(dpr, dpr);
    draw(x);
    return c;
  }

  function drawGaugeC(x, score, max){
    var pct = max ? Math.round(score / max * 100) : 0, c = 66, r = 52;
    x.lineWidth = 12; x.lineCap = 'round';
    x.strokeStyle = '#EDE8E2';
    x.beginPath(); x.arc(c, c, r, 0, Math.PI * 2); x.stroke();
    if (pct > 0) {
      x.strokeStyle = '#F07020';
      x.beginPath();
      x.arc(c, c, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct / 100);
      x.stroke();
    }
    x.textAlign = 'center';
    x.fillStyle = '#1A1A1A'; x.font = '900 29px ' + CF;
    x.fillText(pct + '%', c, c + 4);
    x.fillStyle = '#6B6560'; x.font = '400 11.5px ' + CF;
    x.fillText('적합도', c, c + 22);
  }

  function drawRadarC(x, items){
    var cx = 150, cy = 148, R = 86, n = items.length, i;
    function P(idx, ratio){
      var a = -Math.PI / 2 + idx * 2 * Math.PI / n;
      return [cx + Math.cos(a) * R * ratio, cy + Math.sin(a) * R * ratio];
    }
    function ring(ratio){
      x.beginPath();
      for (i = 0; i < n; i++) { var p = P(i, ratio); if (i) x.lineTo(p[0], p[1]); else x.moveTo(p[0], p[1]); }
      x.closePath();
    }
    x.lineWidth = 1; x.strokeStyle = '#EDE8E2';
    [0.25, 0.5, 0.75, 1].forEach(function(g){ ring(g); x.stroke(); });
    for (i = 0; i < n; i++) {
      var e = P(i, 1);
      x.beginPath(); x.moveTo(cx, cy); x.lineTo(e[0], e[1]); x.stroke();
    }
    x.beginPath();
    for (i = 0; i < n; i++) {
      var r0 = items[i].max ? items[i].score / items[i].max : 0;
      var p = P(i, Math.max(r0, 0.03));
      if (i) x.lineTo(p[0], p[1]); else x.moveTo(p[0], p[1]);
    }
    x.closePath();
    x.fillStyle = 'rgba(240,112,32,.15)'; x.fill();
    x.strokeStyle = '#F07020'; x.lineWidth = 2; x.lineJoin = 'round'; x.stroke();
    for (i = 0; i < n; i++) {
      var r1 = items[i].max ? items[i].score / items[i].max : 0;
      var p2 = P(i, Math.max(r1, 0.03));
      x.beginPath(); x.arc(p2[0], p2[1], 4.5, 0, Math.PI * 2);
      x.fillStyle = '#F07020'; x.fill();
      x.lineWidth = 2; x.strokeStyle = '#FFFFFF'; x.stroke();
    }
    x.font = '700 11.5px ' + CF; x.fillStyle = '#6B6560';
    for (i = 0; i < n; i++) {
      var lp = P(i, 1.26), a = -Math.PI / 2 + i * 2 * Math.PI / n;
      var cs = Math.cos(a), sn = Math.sin(a);
      x.textAlign = Math.abs(cs) < 0.3 ? 'center' : (cs > 0 ? 'left' : 'right');
      x.fillText(items[i].label, lp[0], lp[1] + (sn > 0.5 ? 12 : (sn < -0.5 ? -3 : 4)));
    }
  }

  function drawDonutC(x, parts){
    var c = 74, r = 54, gap = 0.04, acc = -Math.PI / 2;
    x.lineWidth = 17; x.lineCap = 'butt';
    parts.forEach(function(p, i){
      var span = Math.PI * 2 * (p.n / 6);
      x.strokeStyle = SHADES[i % SHADES.length];
      x.beginPath(); x.arc(c, c, r, acc + gap, acc + span - gap); x.stroke();
      acc += span;
    });
    x.textAlign = 'center';
    x.fillStyle = '#1A1A1A'; x.font = '900 25px ' + CF;
    x.fillText('6장', c, c + 2);
    x.fillStyle = '#6B6560'; x.font = '400 11px ' + CF;
    x.fillText('수시 지원', c, c + 20);
  }

  /* 한 장의 내용이 A4 높이를 넘으면 그만큼만 줄여서 정확히 한 장에 담는다.
     인쇄할 때 페이지가 중간에 끊기는 것을 막는 안전장치다. */
  function fitSheets(){
    var sheets = document.querySelectorAll('#report .sheet');
    for (var i = 0; i < sheets.length; i++) {
      var s = sheets[i], inner = s.querySelector('.sheet-inner');
      if (!inner) continue;
      inner.style.transform = '';
      inner.style.width = '';
      var cs = window.getComputedStyle(s);
      var avail = s.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      var need = inner.scrollHeight;
      if (need > avail && need > 0) {
        var k = Math.max(avail / need, 0.55);
        inner.style.transform = 'scale(' + k.toFixed(4) + ')';
        inner.style.width = (100 / k).toFixed(2) + '%';
      }
    }
  }

  function paintReportCharts(R, parts){
    withFonts(function(){
      var slot = function(name){ return document.querySelector('#report [data-chart="' + name + '"]'); };
      var g = slot('gauge'), rd = slot('radar'), dn = slot('donut');
      var t0 = R.typeScores[0];
      if (g)  { g.innerHTML = '';  g.appendChild(chartCanvas(132, 132, function(x){ drawGaugeC(x, t0.score, t0.max); }, 0.90)); }
      if (rd) { rd.innerHTML = ''; rd.appendChild(chartCanvas(300, 296, function(x){ drawRadarC(x, R.typeFixed); }, 0.88)); }
      if (dn) { dn.innerHTML = ''; dn.appendChild(chartCanvas(148, 148, function(x){ drawDonutC(x, parts); }, 0.92)); }
      fitSheets();
      markCharts();
    });
  }

  function loadH2C(cb){
    if (window.html2canvas) { cb(true); return; }
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = function(){ cb(!!window.html2canvas); };
    s.onerror = function(){ cb(false); };
    document.head.appendChild(s);
  }

  function renderPages(cb){
    var sheets = [].slice.call(document.querySelectorAll('#report .sheet'));
    var out = [];
    (function next(i){
      if (i >= sheets.length) { cb(out); return; }
      window.html2canvas(sheets[i], {
        scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false
      }).then(function(canvas){
        canvas.toBlob(function(b){
          // 미리보기는 base64 대신 객체 URL을 쓴다. A4 두 장이면 base64는 수 MB가 된다.
          out.push({ blob: b, url: URL.createObjectURL(b) });
          next(i + 1);
        }, 'image/png');
      }, function(){ cb(out); });
    })(0);
  }

  function savePdf(){
    shareNote('인쇄 창에서 <b>대상을 PDF로 저장</b>으로 고르시면 A4 파일로 받으실 수 있습니다.');
    window.print();
  }

  function saveImages(){
    if (!REPORT_FILES.length) { shareNote('이미지를 아직 만들지 못했습니다. 잠시 후 다시 눌러 주세요.'); return; }
    REPORT_FILES.forEach(function(f, i){
      var url = URL.createObjectURL(f.blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileBase() + '-' + (i + 1) + '.png';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
    });
    shareNote('결과지 ' + REPORT_FILES.length + '장을 저장했습니다. 사진첩이나 다운로드 폴더에서 확인해 주세요.');
  }

  // 결과지 이미지를 File 로 만든다. 만들지 못하면 빈 배열.
  function shareFiles(){
    var files = [];
    try {
      REPORT_FILES.forEach(function(f, i){
        files.push(new File([f.blob], fileBase() + '-' + (i + 1) + '.png', { type:'image/png' }));
      });
    } catch (e) { files = []; }
    return files;
  }

  /* 파일 공유가 되는 기기인지 미리 본다.
     휴대폰(iOS·안드로이드)은 되고, 대부분의 PC 브라우저는 되지 않는다.
     미리보기 링크 안(아티팩트)에서는 브라우저가 막아 어디서도 되지 않는다. */
  function canShareFiles(){
    try {
      var files = shareFiles();
      return !!(files.length && navigator.share && navigator.canShare && navigator.canShare({ files:files }));
    } catch (e) { return false; }
  }

  function canCopyImage(){
    return !!(navigator.clipboard && window.ClipboardItem && navigator.clipboard.write);
  }

  /* 카카오톡으로 함께 넘어갈 문구.
     누가 보낸 결과지인지 학원에서 바로 알 수 있도록 신원을 앞에 둔다.
     맨 끝에 줄바꿈을 남기지 않는다 (빈 줄로 보인다). */
  function shareText(){
    var i = state.info || {};
    var lines = ['[CLS에듀케이션] 수시 지원 전략 진단 결과지'];

    var who = [i.name, i.school, i.grade].filter(Boolean).join(' · ');
    if (who) lines.push(who);
    if (i.phone) lines.push(fmtPhone(i.phone));

    if (LAST && LAST.typeScores && LAST.typeScores[0]) {
      lines.push('추천 전형 · ' + LAST.typeScores[0].name);
    }
    if (LAST && LAST.line) {
      lines.push('대학 라인 · ' + LAST.line.name);
    }
    // 끝에 공백이나 줄바꿈이 남으면 카카오톡에서 빈 줄로 보인다.
    return lines.join('\n').replace(/\s+$/, '');
  }

  function shareImages(){
    if (!REPORT_FILES.length) { shareNote('이미지를 아직 만들지 못했습니다. 잠시 후 다시 눌러 주세요.'); return; }

    // 안드로이드 + 카카오톡 내장 화면이면 공유가 없으니 크롬으로 옮겨 연다.
    if (!canShareFiles() && needsChrome()) { openExternal(); return; }

    var files = shareFiles();
    if (canShareFiles()) {
      // title 은 넘기지 않는다. 카카오톡이 title 과 text 를 따로 붙여 빈 줄이 생긴다.
      navigator.share({
        files: files,
        text: shareText()
      }).then(function(){
        shareNote('공유했습니다.');
      }, function(err){
        // 사용자가 취소한 것과 기기가 막은 것을 구분해 알려 준다.
        if (err && err.name === 'AbortError') return;
        shareNote('이 화면에서는 공유가 막혀 있습니다.<br><b>이미지 저장</b>을 누른 뒤 카카오톡에서 사진으로 보내 주세요.');
      });
      return;
    }

    // 공유가 안 되는 기기에서는 클립보드 복사로 대신한다 (PC 카카오톡에 바로 붙여넣기).
    if (canCopyImage()) {
      copyFirstImage();
      return;
    }

    saveImages();
    shareNote('이 기기는 바로 공유가 되지 않아 이미지로 저장했습니다.<br>카카오톡에서 사진으로 보내 주세요.');
  }

  function copyFirstImage(){
    try {
      navigator.clipboard.write([
        new window.ClipboardItem({ 'image/png': REPORT_FILES[0].blob })
      ]).then(function(){
        shareNote('결과지 1장을 복사했습니다. 카카오톡 대화창에 붙여넣기 하세요.<br>2장 모두 필요하시면 <b>이미지 저장</b>을 눌러 주세요.');
      }, function(){
        saveImages();
        shareNote('복사가 되지 않아 이미지로 저장했습니다. 카카오톡에서 사진으로 보내 주세요.');
      });
    } catch (e) {
      saveImages();
    }
  }

  /* 기기가 할 수 있는 일에 맞춰 버튼 이름과 안내를 바꾼다.
     아무 반응 없는 버튼을 두지 않기 위해서다. */
  function setupShareButton(){
    var share = document.getElementById('btnShare');
    if (!share) return;
    if (canShareFiles()) {
      share.textContent = '공유하기';
      shareNote('공유하기를 누르면 카카오톡을 고를 수 있습니다.');
      return;
    }

    // 안드로이드에서 카카오톡에 딸린 화면으로 열면 공유 기능이 아예 없다.
    if (needsChrome()) {
      share.textContent = '브라우저로 열기';
      shareNote('<b>카카오톡에 딸린 화면이라 공유가 되지 않습니다.</b><br>' +
        '먼저 <b>이미지 저장</b>으로 결과지를 보관하신 뒤, 사진으로 보내 주세요.');
      return;
    }

    if (canCopyImage()) {
      share.textContent = '이미지 복사';
      shareNote('휴대폰에서 열면 <b>공유하기</b>로 카카오톡에 바로 보낼 수 있습니다.<br>지금 기기에서는 복사해 붙여넣기 하세요.');
      return;
    }

    share.textContent = '이미지 저장';
    shareNote('이 기기에서는 바로 공유가 되지 않습니다. 저장한 뒤 사진으로 보내 주세요.');
  }

  function reportNote(t){
    var el = document.getElementById('reportNote');
    if (el) el.innerHTML = t;
  }

  function openView(){
    var v = document.getElementById('rpView');
    if (!v) return;
    v.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function closeView(){
    var v = document.getElementById('rpView');
    if (!v) return;
    v.classList.add('hidden');
    document.body.style.overflow = '';
  }

  /* 버튼을 누른 뒤에 이미지를 만든다.
     A4 두 장을 미리 그려 두면 결과 화면이 뜨는 속도가 느려진다. */
  function showReport(){
    var btn = document.getElementById('btnReport');
    var prev = document.getElementById('rpPreview');

    if (REPORT_FILES.length) { openView(); return; }

    if (btn) { btn.disabled = true; btn.textContent = '결과지를 만드는 중입니다'; }
    reportNote('잠시만 기다려 주세요. 5초 정도 걸립니다.');

    loadH2C(function(ok){
      if (!ok) {
        if (btn) { btn.disabled = false; btn.textContent = '결과지 보기'; }
        reportNote('이미지를 만들지 못했습니다. 화면을 캡처해 주시거나 학원으로 알려 주세요.');
        return;
      }
      onCharts(function(){        // 그래프가 다 그려진 뒤에 이미지로 옮긴다
      renderPages(function(files){
        REPORT_FILES = files;
        if (btn) { btn.disabled = false; btn.textContent = '결과지 보기'; }

        if (!files.length) {
          reportNote('이미지를 만들지 못했습니다. 화면을 캡처해 주시거나 학원으로 알려 주세요.');
          return;
        }

        prev.innerHTML = files.map(function(f, i){
          return '<img src="' + f.url + '" alt="결과지 ' + (i + 1) + '장">';
        }).join('') + '<p>A4 두 장짜리 상담 리포트입니다.<br>아래에서 저장하거나 바로 보내실 수 있습니다.</p>';

        reportNote('결과지가 준비되었습니다.');
        setupShareButton();
        openView();
      });
      });
    });
  }

  function wireShare(){
    var open = document.getElementById('btnReport');
    if (open) open.addEventListener('click', showReport);

    var close = document.getElementById('rpClose');
    if (close) close.addEventListener('click', closeView);

    // 한 번만 연결한다. 결과 화면을 다시 그려도 이 버튼들은 그대로 남는다.
    var pdf = document.getElementById('btnPdf');
    if (pdf && !pdf.dataset.wired) {
      pdf.dataset.wired = '1';
      pdf.addEventListener('click', savePdf);
      document.getElementById('btnSave').addEventListener('click', saveImages);
      document.getElementById('btnShare').addEventListener('click', shareImages);
    }
  }

  /* ─────────────────────────────────────────────
     학원으로 전송
     결과 화면 아래 문구를 실제 전송 결과에 맞춰 바꾼다.
     ───────────────────────────────────────────── */
  function note(text){
    var el = document.getElementById('sendNote');
    if (el) el.innerHTML = text;
  }

  /* 보낼 곳 설정
     SHEET_URL 에 구글 Apps Script 배포 주소를 넣으면 스프레드시트로 한 줄씩 쌓인다.
     설정 방법은 docs/susi-google-sheet.md 참고.
     서버 DB(/api/susi)도 그대로 살아 있으니 나중에 SEND_TO_API 를 true 로 바꾸면 함께 저장된다. */
  var SHEET_URL = '';
  var SEND_TO_API = false;

  /* 첫 화면에 보여 주는 진단 완료 인원.
     TALLY_BASE 는 설문을 열기 전까지 학원에서 직접 상담한 학생 수다.
     여기에 스프레드시트에 쌓인 줄 수를 더해 보여 준다.
     시트가 연결되기 전에는 기준 숫자만 나온다. */
  var TALLY_BASE = 52;

  function hideTally(){
    var box = document.getElementById('tally');
    if (box) box.classList.add('hidden');
  }

  function showTally(n){
    var box = document.getElementById('tally');
    var txt = document.getElementById('tallyText');
    if (!box || !txt) return;
    txt.innerHTML = '지금까지 <b>' + n + '명</b>이 진단을 마쳤습니다';
    box.classList.remove('hidden');
  }

  /* 시트에서 인원을 읽어 온다.
     주소가 다르면 브라우저가 응답을 막으므로, 스크립트 형태로 받아 온다(JSONP). */
  function loadTally(){
    if (!SHEET_URL) { showTally(TALLY_BASE); return; }

    var done = false;
    var finish = function(n){
      if (done) return;
      done = true;
      showTally(TALLY_BASE + (n > 0 ? n : 0));
    };

    window.__clsTally = function(res){ finish(res && res.n ? Number(res.n) : 0); };

    var s = document.createElement('script');
    s.src = SHEET_URL + (SHEET_URL.indexOf('?') < 0 ? '?' : '&') + 'count=1&callback=__clsTally';
    s.onerror = function(){ finish(0); };
    document.head.appendChild(s);

    // 시트가 느리거나 응답이 없어도 화면이 비어 있지 않도록
    setTimeout(function(){ finish(0); }, 3500);
  }

  function flatScores(list){
    var o = {};
    list.forEach(function(s){ o[s.key] = s.score; });
    return o;
  }

  // 스프레드시트 한 줄에 들어갈 모양
  function sheetPayload(R){
    var t0 = R.typeScores[0], t1 = R.typeScores[1], f0 = R.fieldScores[0];
    var g = state.grades;
    return {
      submittedAt: new Date().toISOString(),
      name: state.info.name,
      phone: state.info.phone,
      school: state.info.school || '',
      grade: state.info.grade,
      naesin: { kor:g.naesinKor, math:g.naesinMath, eng:g.naesinEng, inq:g.naesinInq, all:g.naesinAll },
      mock: { kor:g.mockKor, math:g.mockMath, eng:g.mockEng, inq1:g.mockInq1, inq2:g.mockInq2 },
      mathChoice: g.mathChoice || '',
      topType: t0.key, topTypeName: t0.name, secondTypeName: t1.name,
      topField: f0.key, topFieldName: f0.name,
      credit: R.credit,
      lineKey: R.line.key, lineName: R.line.name,
      typeScores: flatScores(R.typeScores),
      fieldScores: flatScores(R.fieldScores),
      plan: plan6(R.typeScores).map(function(p){ return p.name + ' ' + p.n + '장'; }).join(' / '),
      answers: { credit:state.credit, types:state.types, fields:state.fields }
    };
  }

  function send(R){
    if (state.demo) {
      note('미리보기 화면이라 결과를 보내지 않았습니다.');
      return;
    }

    var jobs = [];

    if (SHEET_URL) {
      // Apps Script 는 text/plain 으로 보내야 사전 요청(preflight) 없이 통과한다.
      jobs.push(fetch(SHEET_URL, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify(sheetPayload(R))
      }));
    }

    if (SEND_TO_API) {
      jobs.push(fetch('/api/susi', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          info: state.info,
          grades: state.grades,
          answers: { credit:state.credit, types:state.types, fields:state.fields }
        })
      }));
    }

    if (!jobs.length) {
      note('아래 결과지 보기에서 저장해 두셨다가 면담 때 보여 주세요.');
      return;
    }

    Promise.all(jobs.map(function(p){
      return p.then(function(res){ return !!res && (res.ok || res.type === 'opaque'); }, function(){ return false; });
    })).then(function(results){
      var ok = results.some(function(v){ return v; });
      note(ok
        ? '진단 결과가 CLS에듀케이션으로 전달되었습니다.<br>면담 전에 원장이 미리 살펴본 뒤 준비합니다.'
        : '결과를 보내지 못했습니다.<br>아래 결과지 보기에서 저장해 학원으로 보내 주시면 도와드리겠습니다.');
    });
  }

  /* ─────────────────────────────────────────────
     흐름
     ───────────────────────────────────────────── */
  /* 카카오톡·인스타 안에 딸린 브라우저로 열면, 안드로이드에서는 공유 기능이
     아예 없다(내장 브라우저에 구현돼 있지 않다). 아이폰은 사파리 엔진이라 된다.
     그래서 안드로이드 사용자에게만 크롬으로 옮겨 열도록 안내한다. */
  function isAndroid(){
    return /Android/i.test(navigator.userAgent || '');
  }

  function isInAppBrowser(){
    var ua = navigator.userAgent || '';
    return /KAKAOTALK|Instagram|FBAN|FBAV|NAVER\(inapp|DaumApps|Line\//i.test(ua);
  }

  function needsChrome(){
    return isAndroid() && isInAppBrowser();
  }

  function isKakao(){
    return /KAKAOTALK/i.test(navigator.userAgent || '');
  }

  /* 학생에게 "오른쪽 위 점 세 개를 눌러 다른 브라우저로 여세요"라고 안내하면 대부분 못 한다.
     그래서 화면이 열리자마자 기본 브라우저로 자동으로 넘긴다.
     - 카카오톡은 전용 통로가 있다 (openExternal)
     - 그 밖의 앱은 안드로이드 표준 방식으로 넘긴다
     크롬을 지정하지 않는다. 삼성 인터넷을 쓰는 학생이 훨씬 많고, 거기서도 공유가 잘 된다. */
  function openExternal(){
    var url = window.location.href;
    if (isKakao()) {
      window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
      return;
    }
    window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') +
      '#Intent;scheme=https;S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
  }

  // 자동 전환은 한 번만 시도한다 (실패해도 같은 화면을 맴돌지 않도록)
  function autoEscape(){
    if (!needsChrome()) return;
    try {
      if (sessionStorage.getItem('escaped') === '1') return;
      sessionStorage.setItem('escaped', '1');
    } catch (e) { /* 저장이 막힌 브라우저면 그냥 한 번 시도한다 */ }
    setTimeout(openExternal, 400);
  }

  function inAppNotice(){
    if (!needsChrome()) return '';
    return '<div class="inapp">' +
      '<p class="k">브라우저에서 열어 주세요</p>' +
      '<p>지금 화면은 카카오톡에 딸린 창이라 <b>결과지를 저장하거나 보내는 기능이 동작하지 않습니다.</b> ' +
      '잠시 뒤 휴대폰 기본 브라우저로 자동으로 열립니다. <b>그쪽 창에서 진단을 시작해 주세요.</b></p>' +
      '<button type="button" id="btnChrome">브라우저로 열기</button>' +
      '<p class="sm">자동으로 안 열리면 위 버튼을 눌러 주세요.</p>' +
    '</div>';
  }

  function render(){
    var i = state.step;
    if (i === 0 && !state.started) {
      stepsEl.innerHTML = inAppNotice() +
        '<div class="card">' +
        '<p class="step-t">시작하기 전에</p>' +
        '<h2 class="step-h">10분이면 끝납니다</h2>' +
        '<p class="step-d">성적 입력과 61문항으로 나에게 맞는 전형과 계열, 대학 라인을 잡습니다.</p>' +
        '<div class="howto" style="margin-top:16px"><b>이렇게 진행합니다</b><br>' +
        '1. 기본 정보, 2. 성적 입력, 3. 과목 이수 6문항<br>4. 전형 적합도 30문항, 5. 계열 적합도 25문항</div>' +
        '<p class="step-d">맞고 틀린 답은 없습니다. 지금 내 모습 그대로 골라 주세요.</p>' +
        '</div>';
      var cb = document.getElementById('btnChrome');
      if (cb) cb.addEventListener('click', openExternal);
      nextBtn.textContent = '시작하기';
      prevBtn.classList.add('hidden');
      firstBtn.classList.add('hidden');
      setBar(0, '시작');
      return;
    }
    hideTally();          // 진단이 시작되면 첫 화면 문구는 접는다
    var S = STEPS[i];
    stepsEl.innerHTML = S.build();
    nextBtn.textContent = (i === STEPS.length - 1) ? '결과 보기' : '다음';
    prevBtn.classList.toggle('hidden', i === 0);
    firstBtn.classList.toggle('hidden', i === 0);   // 첫 단계에서는 돌아갈 곳이 없다
    setBar((i / STEPS.length) * 100, S.name, i + 1);
    restore(i);
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function setBar(pct, name, no){
    progEl.style.width = pct + '%';
    stepNameEl.textContent = name;
    stepNoEl.textContent = no || 0;
  }

  // 이전으로 돌아왔을 때 고른 값 되살리기
  function restore(i){
    // 일부만 채운 상태로 뒤로 갔다 와도 그대로 남아 있어야 한다
    if (i === 0) {
      var f = { 'i-name':state.info.name, 'i-phone':state.info.phone,
                'i-school':state.info.school, 'i-grade':state.info.grade };
      Object.keys(f).forEach(function(k){
        var e = document.getElementById(k);
        if (e && f[k]) e.value = f[k];
      });
      var ag = document.getElementById('i-agree');
      if (ag) ag.checked = !!state.info.agreed;
    }
    if (i === 1) {
      var g = state.grades;
      var map = { 'n-kor':g.naesinKor,'n-math':g.naesinMath,'n-eng':g.naesinEng,'n-inq':g.naesinInq,'n-all':g.naesinAll,
                  'm-kor':g.mockKor,'m-math':g.mockMath,'m-eng':g.mockEng,'m-inq1':g.mockInq1,'m-inq2':g.mockInq2 };
      Object.keys(map).forEach(function(k){ var e = document.getElementById(k); if (e && map[k]) e.value = map[k]; });
      var mc = document.getElementById('m-choice'); if (mc) mc.value = g.mathChoice || '';
    }
    if (i === 2) restoreGroup('credit', state.credit);
    if (i === 3) TYPES.forEach(function(t){ restoreGroup('type_' + t.key, state.types[t.key]); });
    if (i === 4) FIELDS.forEach(function(f){ restoreGroup('field_' + f.key, state.fields[f.key]); });
  }

  function restoreGroup(g, arr){
    if (!arr || !arr.length) return;
    arr.forEach(function(v, i){
      if (v === null || v === undefined) return;
      var el = document.querySelector('input[name="' + g + '_' + i + '"][value="' + v + '"]');
      if (el) { el.checked = true; markLabel(el); }
    });
  }

  function markLabel(input){
    var name = input.name;
    document.querySelectorAll('input[name="' + name + '"]').forEach(function(el){
      el.closest('label').classList.toggle('on', el.checked);
    });
  }

  document.addEventListener('change', function(e){
    if (e.target && e.target.type === 'radio') { markLabel(e.target); flashEl.classList.remove('on'); }
  });

  /* 연락처 자동 서식
     01000000000 처럼 붙여 쓰면 치는 대로 010-0000-0000 으로 바뀐다. */
  function phoneMask(v){
    var d = String(v || '').replace(/[^0-9]/g, '').slice(0, 11);
    if (d.length <= 3) return d;
    if (d.length <= 7) return d.slice(0, 3) + '-' + d.slice(3);
    return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
  }

  function maskPhoneInput(el){
    var before = el.value;
    var masked = phoneMask(before);
    if (masked === before) return;

    // 가운데를 고치는 경우에도 커서가 끝으로 튀지 않도록 자릿수를 세어 되돌린다
    var caret = el.selectionStart == null ? before.length : el.selectionStart;
    var digitsBefore = before.slice(0, caret).replace(/[^0-9]/g, '').length;

    el.value = masked;

    var pos = 0, seen = 0;
    while (pos < masked.length && seen < digitsBefore) {
      if (masked.charAt(pos) >= '0' && masked.charAt(pos) <= '9') seen++;
      pos++;
    }
    try { el.setSelectionRange(pos, pos); } catch (e) { /* 일부 브라우저는 지원하지 않는다 */ }
  }

  document.addEventListener('input', function(e){
    if (e.target && e.target.id === 'i-phone') maskPhoneInput(e.target);
  });

  // 입력을 마치면 010-123-4567 같은 옛 번호도 자리에 맞춰 정리한다 (blur 는 위로 퍼지지 않아 캡처로 받는다)
  document.addEventListener('blur', function(e){
    if (e.target && e.target.id === 'i-phone') e.target.value = fmtPhone(e.target.value);
  }, true);

  nextBtn.addEventListener('click', function(){
    if (!state.started) { state.started = true; state.step = 0; render(); return; }
    var err = STEPS[state.step].validate();
    if (err) { flashEl.textContent = err; flashEl.classList.add('on'); return; }
    flashEl.classList.remove('on');
    if (state.step === STEPS.length - 1) { showResult(); return; }
    state.step++;
    render();
  });

  prevBtn.addEventListener('click', function(){
    if (state.step === 0) return;
    capture(state.step);            // 고르던 답을 그대로 담아 둔다
    flashEl.classList.remove('on');
    state.step--;
    render();
  });

  firstBtn.addEventListener('click', function(){
    if (state.step === 0) return;
    capture(state.step);
    flashEl.classList.remove('on');
    state.step = 0;
    render();
  });

  /* 결과 화면만 보고 싶을 때 쓰는 미리보기.
     ?demo=1 을 붙여 열면 답을 무작위로 채워 결과만 보여 준다.
     학원으로 전송하지 않으므로 실제 접수에 섞이지 않는다. */
  function demoFill(){
    var rnd = function(){ return Math.floor(Math.random() * 3); };
    state.demo = true;
    state.info = { name:'홍길동', phone:'010-0000-0000', school:'신현고', grade:'고3', agreed:true };
    state.grades = {
      naesinKor:2, naesinMath:3, naesinEng:2, naesinInq:2, naesinAll:2,
      mockKor:2, mockMath:2, mockEng:1, mockInq1:3, mockInq2:3, mathChoice:'미적분'
    };
    state.credit = CREDIT.map(rnd);
    TYPES.forEach(function(t){ state.types[t.key] = t.qs.map(rnd); });
    FIELDS.forEach(function(f){ state.fields[f.key] = f.qs.map(rnd); });
  }

  // 주소에 ?demo=1 을 붙일 수 없는 곳(미리보기 링크 등)에서는
  // 맨 위 '신내동 CLS에듀케이션' 을 세 번 누르면 같은 미리보기가 열린다.
  (function(){
    var el = document.querySelector('.brandline'), taps = 0, timer = null;
    if (!el) return;
    el.style.cursor = 'default';
    el.addEventListener('click', function(){
      taps++;
      clearTimeout(timer);
      timer = setTimeout(function(){ taps = 0; }, 1200);
      if (taps >= 3) { taps = 0; demoFill(); showResult(); }
    });
  })();

  if (/[?&]demo=1/.test(window.location.search)) {
    demoFill();
    showResult();
  } else {
    render();
    loadTally();    // 첫 화면의 진단 완료 인원
    autoEscape();   // 카카오톡 안이면 기본 브라우저로 자동으로 넘긴다
  }
})();
</script>
</body>
</html>
